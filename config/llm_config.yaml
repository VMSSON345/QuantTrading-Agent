default:
  provider: groq
  model: groq/llama-3.1-8b-instant

writer_agent:
  model: groq/llama-3.3-70b-versatile   # ← nâng lên
  temperature: 0.7
  max_tokens: 2000

judge_agent:
  model: qwen/qwen3-32b      # ← giữ nguyên
  temperature: 0.1
  max_tokens: 314                        # ← giảm xuống, chỉ cần SCORE + COMMENT

reviewer_agent:
  model: groq/llama-3.1-8b-instant   # ← nâng lên
  temperature: 0.3
  max_tokens: 314